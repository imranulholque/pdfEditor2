name: Build Windows app
on:
  push:
    branches: [main]
    paths: [main.js, preload.js, package.json, lib/**]   # editor logic (index.html, js/, knowledge/) updates itself – no new .exe needed
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Editor-Setup
          path: dist/*.exe
